<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevShowcase — Cadastro de Usuário</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --bg: #f4f5fb;
    --text: #1f2333;
    --muted: #6b7280;
    --error: #dc2626;
    --success: #16a34a;
    --border: #d1d5db;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    padding: 32px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }
  .required::after {
    content: " *";
    color: var(--error);
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled {
    background: #a5a6f0;
    cursor: not-allowed;
  }
  #feedback {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    white-space: pre-wrap;
  }
  #feedback.success {
    display: block;
    background: #ecfdf3;
    color: var(--success);
    border: 1px solid #bbf7d0;
  }
  #feedback.error {
    display: block;
    background: #fef2f2;
    color: var(--error);
    border: 1px solid #fecaca;
  }
  .api-info {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .api-info code {
    background: #f3f4f6;
    padding: 2px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Cadastro de Usuário</h1>
    <p class="subtitle">Crie seu perfil de desenvolvedor no DevShowcase.</p>

    <form id="form-cadastro" novalidate>
      <label for="name" class="required">Nome</label>
      <input type="text" id="name" name="name" placeholder="Ana Souza" required maxlength="120" />

      <label for="email" class="required">E-mail</label>
      <input type="email" id="email" name="email" placeholder="ana@example.com" required />

      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" rows="3" maxlength="1000" placeholder="Dev backend apaixonada por APIs"></textarea>

      <label for="avatarUrl">URL do avatar</label>
      <input type="url" id="avatarUrl" name="avatarUrl" placeholder="https://example.com/ana.png" />

      <button type="submit" id="submit-btn">Cadastrar</button>
    </form>

    <div id="feedback"></div>

    <p class="api-info">
      Este formulário envia os dados para <code id="api-endpoint">/api/profiles</code> na API DevShowcase.
    </p>
  </div>

  <script>
    // Em produção, o HTML é servido pela própria API, então uma URL relativa
    // já aponta para o backend correto (mesmo host). Ajuste API_BASE_URL
    // caso o formulário seja hospedado em outro domínio.
    const API_BASE_URL = window.location.origin;
    document.getElementById('api-endpoint').textContent = `${API_BASE_URL}/api/profiles`;

    const form = document.getElementById('form-cadastro');
    const feedbackEl = document.getElementById('feedback');
    const submitBtn = document.getElementById('submit-btn');

    function showFeedback(message, type) {
      feedbackEl.textContent = message;
      feedbackEl.className = type;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showFeedback('', '');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      const payload = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        bio: form.bio.value.trim() || undefined,
        avatarUrl: form.avatarUrl.value.trim() || undefined,
      };

      try {
        const response = await fetch(`${API_BASE_URL}/api/profiles`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json();

        if (!response.ok) {
          const details = Array.isArray(data.errors) ? `\n- ${data.errors.join('\n- ')}` : '';
          throw new Error(`${data.message || 'Erro ao cadastrar usuário.'}${details}`);
        }

        showFeedback(`Usuário cadastrado com sucesso! ID: ${data.id}`, 'success');
        form.reset();
      } catch (err) {
        showFeedback(err.message || 'Erro inesperado ao cadastrar usuário.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Cadastrar';
      }
    });
  </script>
</body>
</html>
